server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  location = /install.sh {
    default_type text/plain;
    charset utf-8;
    add_header Cache-Control "no-cache";
  }
  location = /tchat.tar.gz {
    default_type application/gzip;
    add_header Cache-Control "no-cache";
  }
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
